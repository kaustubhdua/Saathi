services:
  - type: web
    name: saathi-api
    runtime: docker
    healthCheckPath: /health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: API_AUTH_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: MANDI_API_KEY
        sync: false
      - key: MANDI_RESOURCE_ID
        value: 9ef84268-d588-465a-a308-a864a43d0070
      - key: EXOTEL_API_KEY
        sync: false
      - key: EXOTEL_API_TOKEN
        sync: false
      - key: EXOTEL_ACCOUNT_SID
        sync: false
      - key: EXOTEL_VIRTUAL_NUMBER
        sync: false
      - key: EXOTEL_STREAM_URL
        sync: false
      - key: TELEPHONY_CALLBACK_URL
        sync: false
      - key: TELEPHONY_CALLBACK_SIGNATURE_VERIFIED
        value: "false"
      - key: TELEPHONY_WEBHOOK_SECRET
        sync: false
      - key: CALL_API_TOKEN
        sync: false
      - key: TELEPHONY_STREAM_TOKEN
        sync: false
      - key: SARVAM_REALTIME_STT_ENABLED
        value: "false"

  # Dedicated process for persistent in-app reminders. Keep both flags off until
  # migration-history reconciliation and isolated acceptance are approved.
  - type: worker
    name: saathi-reminder-worker
    runtime: docker
    dockerCommand: python -m app.reminder_worker
    envVars:
      - key: APP_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SAATHI_HOUSEHOLD_FEATURES_ENABLED
        value: "false"
      - key: SAATHI_REMINDERS_ENABLED
        value: "false"
      - key: REMINDER_BATCH_SIZE
        value: "25"
      - key: REMINDER_WORKER_INTERVAL_SECONDS
        value: "30"
