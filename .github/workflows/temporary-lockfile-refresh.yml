name: Temporary frontend lockfile refresh

on:
  push:
    branches:
      - feat/saathi-verified-household-auth-2026-10-15-v3

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Regenerate lockfile from branch package manifest
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lockfile to this feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already matches package.json"
            exit 0
          fi
          git commit -m "chore(frontend): synchronize lockfile with auth dependencies"
          git push origin HEAD:${{ github.ref_name }}
