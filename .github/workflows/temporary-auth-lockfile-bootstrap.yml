name: Temporary frontend lockfile bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: github.event.pull_request.head.ref == 'feat/saathi-auth-consent-current-main-2026-10-15' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate lockfile for the reviewed manifest
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit only the generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already matches package.json."
            exit 0
          fi
          git commit -m "chore(auth): regenerate frontend lockfile [skip ci]"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
